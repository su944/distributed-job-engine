services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: jobengine
      POSTGRES_USER: jobengine
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD for local PostgreSQL}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobengine -d jobengine"]
      interval: 2s
      timeout: 3s
      retries: 15
    stop_grace_period: 20s

volumes:
  postgres_data:
